name: Publish NuGet packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.3xx
            10.0.x
      - name: Check release tag against committed package version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: ./scripts/Assert-ReleaseVersion.ps1 -Tag $env:RELEASE_TAG -Prerelease ([bool]::Parse($env:RELEASE_PRERELEASE))
      - run: dotnet restore QuantumMatter.sln
      - run: dotnet build QuantumMatter.sln --no-restore -c Debug --verbosity minimal
      - run: dotnet test QuantumMatter.sln --no-build --no-restore -c Debug --verbosity minimal
      - run: dotnet build QuantumMatter.sln --no-restore -c Release --verbosity minimal
      - run: dotnet test QuantumMatter.sln --no-build --no-restore -c Release --verbosity minimal
      - run: dotnet format QuantumMatter.sln --no-restore --verify-no-changes
      - name: Verify .NET 9 package consumer
        shell: pwsh
        run: ./scripts/Test-Packages.ps1 -Configuration Release -SkipBuild
      - name: Verify .NET 10 package consumer
        shell: pwsh
        run: ./scripts/Test-Packages.ps1 -Configuration Release -SkipBuild -ConsumerFramework net10.0
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ matrix.os }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.3xx'
      - uses: actions/download-artifact@v4
        with:
          name: release-packages-ubuntu-latest
          path: artifacts/packages
      # Same NuGet owner and OIDC login convention as XBullet.EasyTesting.
      - name: Log in to NuGet.org with trusted publishing
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: olgerd007
      - name: Publish validated packages and symbols
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          # dotnet pushes the matching snupkg automatically with each nupkg.
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
