name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pqc-security:
    runs-on: ubuntu-latest
    # Resolute supplies the newer OpenSSL required by .NET PQC. Strict mode
    # deliberately fails if the provider/image ceases to support the algorithms.
    container: mcr.microsoft.com/dotnet/sdk:10.0.402-resolute@sha256:9b045c06c7b57d3ba40a3f1731c843b8e9d707bce6aee069a7868dd75e3bb99e
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/Test-ReportPrivacy.ps1
      - run: dotnet restore QuantumMatter.sln
      - name: Exercise protocol, framing and strict-policy tests
        run: dotnet test tests/QuantumMatter.Tests/QuantumMatter.Tests.csproj --no-restore -c Release -f net10.0 --filter "FullyQualifiedName~Pqc" --verbosity minimal
      - name: Require real PQC and authenticated-session validation
        run: dotnet run --project experiments/QuantumMatter.CryptographyLab -c Release --no-build -- --session --strict --require ML-KEM-768 --require ML-DSA-65 --repetitions 3 --warmup 1 --output artifacts/pqc-security.json
      - name: Verify generated report privacy
        id: report-privacy
        if: always()
        run: ./scripts/Test-ReportPrivacy.ps1 -ReportPaths docs,artifacts/pqc-security.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.report-privacy.outcome == 'success'
        with:
          name: pqc-security-report
          path: artifacts/pqc-security.json
          if-no-files-found: ignore
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Debug, Release]
        framework: [net9.0, net10.0]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify public report privacy
        shell: pwsh
        run: ./scripts/Test-ReportPrivacy.ps1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.3xx
            10.0.x
      - run: dotnet restore QuantumMatter.sln
      - run: dotnet build QuantumMatter.sln --no-restore --configuration ${{ matrix.configuration }} --verbosity minimal
      - run: dotnet test tests/QuantumMatter.Tests/QuantumMatter.Tests.csproj --no-build --no-restore --configuration ${{ matrix.configuration }} --framework ${{ matrix.framework }} --logger "trx;LogFilePrefix=tests" --results-directory artifacts/test-results --verbosity minimal
      - name: Verify portable fallbacks without hardware intrinsics
        if: matrix.configuration == 'Release'
        env:
          DOTNET_EnableHWIntrinsic: '0'
        run: dotnet test tests/QuantumMatter.Tests/QuantumMatter.Tests.csproj --no-build --no-restore --configuration Release --framework ${{ matrix.framework }} --verbosity minimal
      - run: dotnet format QuantumMatter.sln --no-restore --verify-no-changes
      - name: Validate SDK packages and clean .NET 9 consumer
        if: matrix.configuration == 'Release' && matrix.framework == 'net9.0'
        shell: pwsh
        run: ./scripts/Test-Packages.ps1 -Configuration Release -SkipBuild
      - name: Validate .NET 10 consumer of net9.0 packages
        if: matrix.configuration == 'Release' && matrix.framework == 'net9.0'
        shell: pwsh
        run: ./scripts/Test-Packages.ps1 -Configuration Release -SkipBuild -ConsumerFramework net10.0
      - uses: actions/upload-artifact@v4
        if: matrix.configuration == 'Release' && matrix.framework == 'net9.0'
        with:
          name: packages-${{ matrix.os }}
          path: artifacts/packages/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.configuration }}-${{ matrix.framework }}
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
